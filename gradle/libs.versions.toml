[versions]
dokka = "2.2.0"
jacoco = "0.8.15"
junit = "6.1.3"
slf4j = "2.0.18"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.7" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version = "8.0.4" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
dokka-core = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
spotless = { id = "com.diffplug.spotless", version = "8.10.1" }
versions = { id = "io.github.ben-manes.versions", version = "0.61.0" }
